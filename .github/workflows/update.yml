name: Update cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask

jobs:
  update:
    runs-on: macos-latest
    env:
      TAP: ${{ github.repository_owner }}/macmute
      CASK: ${{ github.repository_owner }}/macmute/macmute
      # Authenticates livecheck's GitHub API calls; shared runner IPs hit
      # the anonymous rate limit quickly.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v5

      # Taps this repository by linking the checkout into Homebrew's taps.
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Check for a new release
        id: livecheck
        run: |
          json="$(brew livecheck --cask --json "$CASK")"
          echo "$json"
          latest="$(jq -r '.[0].version.latest' <<<"$json")"
          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "::error::livecheck did not return a version"
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "outdated=$(jq -r '.[0].version.outdated' <<<"$json")" >> "$GITHUB_OUTPUT"

      - name: Update version and checksum
        if: steps.livecheck.outputs.outdated == 'true'
        env:
          LATEST: ${{ steps.livecheck.outputs.latest }}
        run: brew bump-cask-pr --write-only --version "$LATEST" "$CASK"

      - name: Audit
        if: steps.livecheck.outputs.outdated == 'true'
        run: brew audit --cask --strict --online "$CASK"

      - name: Test install
        if: steps.livecheck.outputs.outdated == 'true'
        run: |
          brew install --cask "$CASK"
          brew uninstall --cask "$CASK"

      - name: Commit and push
        if: steps.livecheck.outputs.outdated == 'true'
        env:
          LATEST: ${{ steps.livecheck.outputs.latest }}
        run: |
          cd "$(brew --repository "$TAP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "MacMute $LATEST"
          git push origin "HEAD:$GITHUB_REF_NAME"
